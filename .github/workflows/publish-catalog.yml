name: Publish app catalog

on:
  push:
    branches: [main]
    paths:
      - "data/catalog.source.json"
      - "catalog/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "build-tools;36.0.0"
      - run: npm ci
      - run: npm run generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAPT_PATH: ${{ env.ANDROID_HOME }}/build-tools/36.0.0/aapt
      - run: npm run check
      - run: npm test
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
